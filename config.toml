# Titan Compositor Configuration v17
# ~/.config/titan/config.toml

[colors]
background = "#0a0a14"
focus_border = "#7aa2f7"
unfocus_border = "#2a2c3e"
bar_background = "#08080f"
bar_foreground = "#c0caf5"
bar_workspace_active = "#7aa2f7"
bar_workspace_inactive = "#3b3d57"
bar_status = "#9ece6a"
bar_urgent = "#f7768e"
bar_separator = "#414868"

[bar]
enabled = true
height = 42
font_size = 14
workspace_radius = 4
workspace_spacing = 8
padding_left = 20
padding_right = 20
opacity = 0.92
separator_width = 1
gradient_top = "#16161e"
gradient_bottom = "#08080f"
show_date = true
show_cpu = true
show_memory = true

[wallpaper]
mode = "image"
color = "#0a0a14"
path = ""
directory = ""
gradient_top = "#1a1a3e"
gradient_bottom = "#0a0a14"
change_interval = 0
scaling = "fill"
block_height_gobs = 0

[layout]
border_width = 4
gap = 10
margin = 3

[keybindings]
"super+return" = "terminal"
"super+q" = "close"
"super+d" = "launcher"
"super+f" = "fullscreen"
"super+shift+escape" = "quit"
"super+1" = "workspace_1"
"super+2" = "workspace_2"
"super+3" = "workspace_3"
"super+4" = "workspace_4"
"super+w" = "wallpaper_next"

[terminal]
command = "foot"
font = "monospace"
font_size = 12

[launcher]
command = "wmenu"
prompt = "Launch"
lines = 10
