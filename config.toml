# Titan Compositor Configuration
# ~/.config/titan/config.toml

[colors]
background = "#0f0f1a"
focus_border = "#7aa2f7"
unfocus_border = "#3b3d57"
bar_background = "#0d0d16"
bar_foreground = "#c0caf5"
bar_workspace_active = "#7aa2f7"
bar_workspace_inactive = "#3b3d57"
bar_status = "#9ece6a"
bar_urgent = "#f7768e"
bar_separator = "#414868"

[bar]
enabled = true
height = 36
font_size = 14
workspace_radius = 4
workspace_spacing = 6
padding_left = 16
padding_right = 16
opacity = 0.92
separator_width = 1
gradient_top = "#16161e"
gradient_bottom = "#0d0d16"
show_date = true
show_cpu = true
show_memory = true

[wallpaper]
# 壁纸模式: "color" | "image" | "random" | "gradient"
mode = "gradient"
color = "#0f0f1a"
path = ""
directory = ""
gradient_top = "#1a1a3e"
gradient_bottom = "#0f0f1a"
change_interval = 0
scaling = "fill"
# NVIDIA block-linear: 每个 block 的 GOB 数量 (0=禁用, 16=典型值)
block_height_gobs = 0

[layout]
border_width = 3
gap = 8
margin = 2

[keybindings]
"super+return" = "terminal"
"super+q" = "close"
"super+d" = "launcher"
"super+f" = "fullscreen"
"super+shift+escape" = "quit"
"super+1" = "workspace_1"
"super+2" = "workspace_2"
"super+3" = "workspace_3"
"super+4" = "workspace_4"
"super+w" = "wallpaper_next"

[terminal]
command = "foot"
font = "monospace"
font_size = 12

[launcher]
command = "wmenu"
prompt = "Launch"
lines = 10
