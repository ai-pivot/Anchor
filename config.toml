# Anchor Compositor Configuration v25
# ~/.config/anchor/config.toml

[colors]
background = "#0d0d1a"
focus_border = "#7aa2f7"
unfocus_border = "#24253a"
bar_background = "#06060e"
bar_foreground = "#c0caf5"
bar_workspace_active = "#7aa2f7"
bar_workspace_inactive = "#3b3d57"
bar_status = "#9ece6a"
bar_urgent = "#f7768e"
bar_separator = "#414868"

[bar]
enabled = true
height = 48
font_size = 14
workspace_radius = 4
workspace_spacing = 8
padding_left = 20
padding_right = 20
opacity = 0.92
separator_width = 1
gradient_top = "#16161e"
gradient_bottom = "#08080f"
show_date = true
show_cpu = true
show_memory = true

[wallpaper]
mode = "image"
color = "#0a0a14"
path = ""
directory = ""
gradient_top = "#1a1a3e"
gradient_bottom = "#0a0a14"
change_interval = 0
scaling = "fill"
block_height_gobs = 0

[layout]
border_width = 4
gap = 14
margin = 6

[keybindings]
"super+return" = "terminal"
"super+q" = "close"
"super+d" = "launcher"
"super+f" = "fullscreen"
"super+shift+escape" = "quit"
"super+1" = "workspace_1"
"super+2" = "workspace_2"
"super+3" = "workspace_3"
"super+4" = "workspace_4"
"super+w" = "wallpaper_next"

[terminal]
command = "foot"
font = "monospace"
font_size = 12

[launcher]
prompt = "Launch"
lines = 10

[input_method]
# Supported: "fcitx", "ibus", "none"
method = "fcitx"

# 窗口规则：根据 app_id 自动分配工作区
[[window_rule]]
app_id = "firefox"
workspace = 1
layout = "master-stack"

[[window_rule]]
app_id = "code"
workspace = 2
layout = "columns"

[[window_rule]]
app_id = "foot"
workspace = 0

# ─── GPU 配置 ───
# gpu_vendor: 优先使用的 GPU vendor
#   "auto"    — 自动检测（默认，选第一个 DRM 设备）
#   "nvidia"  — 优先选 NVIDIA GPU
#   "amd"     — 优先选 AMD GPU
#   "intel"   — 优先选 Intel GPU
# gpu_device: 指定 DRM 设备路径（优先于 vendor）
#   "" 或不设置 — 自动检测
#   "/dev/dri/card1" — 手动指定
[gpu]
vendor = "auto"
device = ""
